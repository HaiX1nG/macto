<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Macto Tray Icon Source -->
  <!-- A microphone icon representing voice communication -->

  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main circle background -->
  <circle cx="32" cy="32" r="28" fill="url(#bgGradient)"/>

  <!-- Microphone icon -->
  <g fill="white">
    <!-- Mic body -->
    <rect x="26" y="16" width="12" height="20" rx="6" ry="6"/>
    <!-- Mic base -->
    <path d="M20 30v6c0 6.627 5.373 12 12 12s12-5.373 12-12v-6h-2v6c0 5.523-4.477 10-10 10s-10-4.477-10-10v-6h-2z"/>
    <!-- Mic stand -->
    <rect x="30" y="46" width="4" height="6"/>
    <rect x="24" y="50" width="16" height="2" rx="1"/>
  </g>
</svg>
